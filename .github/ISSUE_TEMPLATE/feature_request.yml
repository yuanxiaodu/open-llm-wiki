name: Feature request
description: 提出功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不顺手/缺什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - backend / agent
        - web UI
        - wiki / ingest
        - plugins
        - deployment / docs
        - other
