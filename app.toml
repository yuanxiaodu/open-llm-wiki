# Open LLM Wiki — project-side application configuration.
#
# This file is tracked by the *project* repository. It is not the wiki vault:
# the vault is a separate Git repository at WIKI_DIR (default DATA_DIR/wiki).
#
# It holds non-secret, versioned application settings: site identity, UI labels
# and welcome cards, agent persona/rules, long-document ingest prompt, and plugin
# enablement. Secrets and per-deployment runtime settings belong in .env.
#
# SCHEMA.md / index.md / log.md belong to the wiki vault. This file never
# generates or overwrites them.

[site]
name = "知识库"
description = "一个由 AI 维护、可自托管的个人知识库"

[ui.type_labels]
entity = "实体"
concept = "概念"
comparison = "对比"
query = "查询"

[agent]
persona = "你是这个知识库唯一的维护智能体。说话短，先查再写。"
rules = """
- 先 search 再写页。
"""

# [ingest]
# system_prompt 可选；不写就用内置模板（引用 site.name）。

[[ui.build_actions]]
key = "ask"
icon = "🔍"
title = "问知识库"
example = "这个知识库主要记录什么？"

[[ui.build_actions]]
key = "feed"
icon = "📄"
title = "整理一份资料"
example = "把 PDF 拖进来，自动整理成页"

[[ui.build_actions]]
key = "lint"
icon = "🩺"
title = "体检知识库"
example = "查断链、重复页、过期页"

[[ui.readonly_actions]]
key = "ask"
icon = "🔍"
title = "问知识库"
example = "这个知识库主要记录什么？"

[[ui.readonly_actions]]
key = "find"
icon = "🗂️"
title = "找已有内容"
example = "知识库里有哪些讲这个主题的页面？"

[[ui.readonly_actions]]
key = "digest"
icon = "📌"
title = "划个重点"
example = "把这个主题的关键内容梳理一下"

# Plugins are opt-in. Add an id here after installing a plugin package under
# plugins/<id>/; the SPA discovers its frontend entry at build time.
[plugins]
enabled = []
