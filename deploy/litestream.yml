# Litestream v0.5.x：把 SQLite（data/db.sqlite3）持续复制到 S3 / S3 兼容对象存储
# （ADR 2026-10-24 决策 1；部署步骤见 DEPLOY §17）。
#
# 它只保数据库。**data/wiki 的 git 仓库、uploads/ 不在这里**——那些是
# scripts/restic_backup.sh 的活（wiki 是唯一不可再生资产，Litestream 不覆盖它）。
#
# 安装（服务器上）：
#   sudo cp deploy/litestream.yml /etc/litestream.yml
#   sudo install -m 600 -o root -g root deploy/backup.env.example /etc/openllmwiki/backup.env
#   # 填 /etc/openllmwiki/backup.env 里的 LITESTREAM_* 与 AWS_*，然后：
#   sudo systemctl enable --now openllmwiki-litestream
#   journalctl -u openllmwiki-litestream -f        # 看到 "replica sync" 一类的行就是在工作
#
# 环境变量展开：v0.5 在解析本文件**之前**会把 $VAR / ${VAR} 换成环境里的值。
# systemd 单元用 EnvironmentFile=/etc/openllmwiki/backup.env 注入，所以下面这些占位
# 由 backup.env 提供。AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 是 Litestream 自动
# 读取的标准变量（也可以用 LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY；
# 配置文件里的值优先级最高）。
#
# 三种典型填法（都改 /etc/openllmwiki/backup.env，不要改本文件）：
#   1) AWS 原生 S3：LITESTREAM_BUCKET=my-bucket
#      LITESTREAM_REGION=ap-northeast-1
#      LITESTREAM_ENDPOINT 留空、LITESTREAM_FORCE_PATH_STYLE=false，
#      下面 endpoint / force-path-style 两行保持注释。
#   2) Cloudflare R2 / Backblaze B2 / MinIO 等 S3 兼容：
#      LITESTREAM_ENDPOINT=https://<account>.r2.cloudflarestorage.com
#      LITESTREAM_REGION=auto（各家的值看服务商文档）
#      LITESTREAM_FORCE_PATH_STYLE=true
#      并把下面 endpoint / force-path-style 两行取消注释。
#      （注意：这些值会**原样**展开进 YAML，布尔必须写 true/false，不能写 0/1——
#       展开发生在 YAML 解析之前，写 1 会变成数字，Litestream 解布尔会报错。）
#   3) 阿里云 OSS：别用 s3 型。把 replica 整块换成
#        replica:
#          type: oss
#          bucket: ${LITESTREAM_BUCKET}
#          path: openllmwiki/db
#          endpoint: ${LITESTREAM_ENDPOINT}
#          region: ${LITESTREAM_REGION}
#          access-key-id: ${AWS_ACCESS_KEY_ID}
#          secret-access-key: ${AWS_SECRET_ACCESS_KEY}
#      （字段名以 litestream 的 OSS 文档为准。）
#
# CLI 备选（不想用配置文件 + systemd 时，等价于下面这段；仍推荐前者）：
#   export LITESTREAM_ACCESS_KEY_ID=... LITESTREAM_SECRET_ACCESS_KEY=...
#   litestream replicate /opt/open_llm_wiki/data/db.sqlite3 \
#     s3://$LITESTREAM_BUCKET/openllmwiki/db

dbs:
  - path: /opt/open_llm_wiki/data/db.sqlite3

    # 监控数据库变更的间隔（默认 1s）。checkpoint 交给 Litestream 用 PASSIVE 做，
    # 不阻塞正在读写的请求。
    monitor-interval: 1s
    checkpoint-interval: 1m

    replica:
      # v0.5 的写法：单个 replica（旧版 v0.3.x 是 replicas: 列表，字段同形）。
      url: s3://${LITESTREAM_BUCKET}/openllmwiki/db
      region: ${LITESTREAM_REGION}

      # 每 10s 推一批 WAL 帧（默认 1s）。对象存储按 PUT 计费时 1s 太贵；
      # 10s 的 RPO 对 7 人共写站足够——最坏丢 10 秒的消息，本地备份/restic 另有一层。
      sync-interval: 10s

      # S3 兼容存储（R2 / B2 / MinIO）取消下面两行的注释；AWS 原生 S3 保持注释。
      # endpoint: ${LITESTREAM_ENDPOINT}
      # force-path-style: ${LITESTREAM_FORCE_PATH_STYLE}

      # 凭据走环境变量（AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY，或 LITESTREAM_*），
      # 不写进本文件——它要能安全地进 git。
      #
      # access-key-id: ${AWS_ACCESS_KEY_ID}
      # secret-access-key: ${AWS_SECRET_ACCESS_KEY}

# 恢复（先停两个服务，详见 DEPLOY §17）：
#   sudo systemctl stop openllmwiki openllmwiki-litestream
#   sudo litestream restore -o /opt/open_llm_wiki/data/db.sqlite3 \
#     s3://$LITESTREAM_BUCKET/openllmwiki/db
#   sudo systemctl start openllmwiki openllmwiki-litestream
# 想恢复到某个时刻用 -timestamp（例：-timestamp 2026-10-24T03:00:00Z）。
