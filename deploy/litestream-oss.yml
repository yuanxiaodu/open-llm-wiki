# Litestream v0.5.3+：阿里云 OSS 原生 replica（只保 data/db.sqlite3）
# 官方指南：https://litestream.io/guides/alibaba-oss/
#
# 使用前替换 BUCKET / REGION；凭据走环境变量：
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（RAM 最小权限即可）
# 安装：
#   sudo cp deploy/litestream-oss.yml /etc/litestream.yml
#   sudo systemctl enable --now openllmwiki-litestream
# 自检：
#   litestream databases -config /etc/litestream.yml
#   journalctl -u openllmwiki-litestream -f
dbs:
  - path: /opt/open_llm_wiki/data/db.sqlite3
    monitor-interval: 1s
    checkpoint-interval: 1m
    replica:
      type: oss
      bucket: BUCKET
      # 例：cn-hangzhou / cn-beijing；与 OSS 控制台一致
      region: REGION
      path: openllmwiki/db
      # 凭据从 EnvironmentFile 注入（deploy/backup.env.example 里的 OSS_*）
      # 不要把 AccessKey 写进本文件
      sync-interval: 10s
      # 可选：
      # part-size: 10485760
      # concurrency: 5
